<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- High-Precision Rounded Squircle Icon Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Bloch Sphere Outer Rim -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#93C5FD" stroke-width="1.75" stroke-opacity="0.45" />

  <!-- Bloch Sphere Equatorial Plane -->
  <ellipse cx="32" cy="32" rx="21" ry="7.5" fill="none" stroke="url(#glow)" stroke-width="1.75" />

  <!-- Z-Axis (Vertical Spindle) -->
  <line x1="32" y1="11" x2="32" y2="53" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />

  <!-- Dynamic Quantum Signal Waveform (Pulse Activity) -->
  <path
    d="M14 32 H23 L27 19 L37 45 L41 32 H50"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Active Qubit Decoherence Beacon -->
  <circle cx="37" cy="45" r="2.5" fill="#F43F5E" />
  <circle cx="27" cy="19" r="2.5" fill="#60A5FA" />
</svg>
